services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: flowchat
      MYSQL_USER: flowchat
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - dados_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$secret"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: flowchat
      DB_USERNAME: flowchat
      DB_PASSWORD: secret
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  fila:
    build: .
    # Worker da fila + agendador (varredura de agendamentos pendentes a cada minuto)
    command: sh -c "php artisan queue:work --tries=3 & exec php artisan schedule:work"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: flowchat
      DB_USERNAME: flowchat
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy

volumes:
  dados_mysql:
